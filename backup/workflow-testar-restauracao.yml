# Copie para .github/workflows/testar-restauracao.yml no repositório PRIVADO das cópias (veja docs/backup.md).
# Só roda quando alguém clica em "Run workflow".
name: Testar restauração

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Pedrocs50/upenglish
          path: upenglish

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar o que o script usa
        run: |
          npm install --prefix upenglish/backup --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Baixar a cópia mais recente
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.gpg' --dir copia
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restaurar e comparar
        run: bash upenglish/backup/testar-restauracao.sh copia/banco-*.gpg copia/arquivos-*.gpg
        env:
          TESTE_SUPABASE_DB_URL: ${{ secrets.TESTE_SUPABASE_DB_URL }}
          TESTE_SUPABASE_URL: ${{ secrets.TESTE_SUPABASE_URL }}
          TESTE_SUPABASE_SERVICE_KEY: ${{ secrets.TESTE_SUPABASE_SERVICE_KEY }}
          SENHA_BACKUP: ${{ secrets.SENHA_BACKUP }}
